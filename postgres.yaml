services:
  postgres:
    image: pgvector/pgvector:pg16    
    environment:
      - POSTGRES_PASSWORD=keWE55v95TCuajS4mZaKvrd3uGwODBoM
      - TZ=America/Sao_Paulo
    networks:
      - minha_rede    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager         
      resources:
        limits:
          cpus: "1"
          memory: 2048M

volumes:
  postgres_data:
    external: true
    name: postgres_data

networks:
  minha_rede:
    external: true
    name: minha_rede